# Runs lint and the core tests on every push to main and on every PR.
# Both jobs use Apple Silicon runners (free for public repos), the same
# platform as the dev machine, and install from pixi.lock exactly.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks code, it never writes to the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now pointless, run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          environments: lint
          cache: true
          # Only main writes the cache, so PR branches can't fill it up.
          cache-write: ${{ github.event_name == 'push' }}
      - name: Run pre-commit on all files
        run: pixi run -e lint lint
        env:
          # mypy needs the core env; the test job runs it.
          SKIP: mypy

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          environments: core
          cache: true
          cache-write: ${{ github.event_name == 'push' }}
      - name: Type check
        run: pixi run -e core typecheck
      - name: Unit and property tests
        # The runner has no GPU, so MuJoCo can't render: skip the gl tests.
        run: pixi run -e core test -m "not gl"
